plugins {
    id 'com.android.application'
}

android {
    namespace 'top.yemanqi.pokecatch'
    compileSdk 34

    defaultConfig {
        applicationId "top.yemanqi.pokecatch"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.0-gecko"
        // 只打 arm64：GeckoView 是全量内核，按架构分包后仍有 ~60MB
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装；正式发布请换自己的 keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Firefox 内核。选它的原因：自带 Necko 网络栈，有自己的 DNS 解析和
    // "network.dns.disableIPv6" 开关，不依赖系统解析器，也就不会踩到
    // 手机优先走 IPv6、而运营商 IPv6 到 Cloudflare/AWS 全断的坑。
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:159.0.20261102144711'

    // 统一 Kotlin 标准库版本：appcompat 与 webkit 各自带了一份 kotlin-stdlib，
    // 版本不一致会让 checkDebugDuplicateClasses 报 duplicate class（1.8.22 vs 1.6.21）
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
