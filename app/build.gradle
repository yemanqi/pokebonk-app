plugins {
    id 'com.android.application'
}

android {
    namespace 'top.yemanqi.pokecatch'
    compileSdk 34

    defaultConfig {
        applicationId "top.yemanqi.pokecatch"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装；正式发布请换自己的 keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
