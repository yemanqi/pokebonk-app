plugins {
    id 'com.android.application'
}

android {
    namespace 'top.yemanqi.pokecatch'
    compileSdk 34

    defaultConfig {
        applicationId "top.yemanqi.pokecatch"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装；正式发布请换自己的 keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // 统一 Kotlin 标准库版本：appcompat 与 webkit 各自带了一份 kotlin-stdlib，
    // 版本不一致会让 checkDebugDuplicateClasses 报 duplicate class（1.8.22 vs 1.6.21）
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
